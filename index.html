<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Michelangelo</title>
    <script type="module" crossorigin src="./assets/index-CqzVP-j9.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/style-Bg6i4d-d.css">
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <h1>Michelangelo</h1>
          <p class="byline">by Arjun Bhumula and Navath Mandala</p>
        </div>
        <div class="tabs" id="tabs" role="tablist" aria-label="Choose a sculpture"></div>
      </header>
      <main>
        <section class="stage" id="stage">
          <div id="viewer"></div>
          <img class="reference" id="reference" alt="" />
          <p class="hint" id="hint" hidden></p>
          <div class="status" id="status">Loading the statue…</div>
          <aside class="card" id="card" hidden>
            <button type="button" class="close" id="close" aria-label="Close">×</button>
            <div class="card-top">
              <div class="pics" id="pics"></div>
              <h2 id="headline"></h2>
            </div>
            <p id="details"></p>
          </aside>
        </section>
      </main>
    </div>
  </body>
</html>
